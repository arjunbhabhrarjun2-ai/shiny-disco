<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 80" role="img" aria-label="CryptoTradePrime">
  <defs>
    <!-- Deep navy → royal blue coin face -->
    <linearGradient id="ctp-med" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0A1A3F"/>
      <stop offset="55%"  stop-color="#15306E"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <!-- Brushed gold -->
    <linearGradient id="ctp-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F7E7A6"/>
      <stop offset="45%"  stop-color="#E8C25A"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
    <!-- Top-left sheen -->
    <radialGradient id="ctp-sheen" cx="34%" cy="30%" r="62%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <!-- Platinum wordmark -->
    <linearGradient id="ctp-word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#F5F7FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Mark: growth coin -->
  <g transform="translate(8 8)">
    <circle cx="32" cy="32" r="30.5" fill="url(#ctp-med)" stroke="url(#ctp-gold)" stroke-width="2.6"/>
    <circle cx="32" cy="32" r="25.5" fill="none" stroke="url(#ctp-gold)" stroke-opacity="0.45" stroke-width="0.9"/>
    <circle cx="32" cy="32" r="30.5" fill="url(#ctp-sheen)"/>

    <!-- Ascending bars -->
    <g fill="url(#ctp-gold)">
      <rect x="15.5" y="38" width="5" height="9"  rx="1.4" opacity="0.55"/>
      <rect x="24"   y="34" width="5" height="13" rx="1.4" opacity="0.72"/>
      <rect x="32.5" y="30" width="5" height="17" rx="1.4" opacity="0.86"/>
      <rect x="41"   y="25" width="5" height="22" rx="1.4"/>
    </g>

    <!-- Upward trend line -->
    <path d="M16 39 L26.5 33.5 L35 30 L46 22" fill="none" stroke="#FFFFFF"
          stroke-opacity="0.92" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Arrowhead -->
    <path d="M40 22 L47 20.5 L45.5 27.5 Z" fill="#FFFFFF" fill-opacity="0.95"/>
    <circle cx="16" cy="39" r="1.5" fill="url(#ctp-gold)"/>
    <circle cx="46" cy="22" r="1.6" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(88 0)"
     font-family="'Helvetica Neue', 'Inter', Arial, sans-serif"
     font-weight="800" letter-spacing="0.2">
    <text x="0" y="46" font-size="29">
      <tspan fill="url(#ctp-word)">CryptoTrade</tspan><tspan fill="url(#ctp-gold)">Prime</tspan>
    </text>
    <text x="2" y="63" font-size="8.5" letter-spacing="3.5" font-weight="600" fill="#E8C25A" opacity="0.9">
      PRIME BROKERAGE · DIGITAL ASSETS
    </text>
  </g>
</svg>
